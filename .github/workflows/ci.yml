# Comprobaciones en cada push y en cada pull request.
#
# Revoca T4-04 (2026-09-23): con el repositorio publico, alguien que no es el autor puede abrir un
# PR, y hasta ahora nada comprobaba que el proyecto compilase fuera de su equipo. Es lo unico que el
# corte local no cubre, y lo que CONTEXT §3 reconocia como hueco.
#
# Repite las mismas comprobaciones que `release.ps1`, y **no publica nada**: el corte de versión
# sigue siendo local (decision del 2026-07-24). Por eso no hay secretos ni permisos de escritura.
#
# Las acciones van fijadas por el SHA del commit, con la versión al lado (T12-26). Una etiqueta
# como `v4` la puede mover quien controle ese repositorio, y lo que apunte mañana correría aquí
# sin que nadie lo haya mirado; un SHA no se mueve. Para subir una: se busca el SHA de la versión
# nueva (`gh api repos/<dueño>/<acción>/commits/<etiqueta> -q .sha`) y se cambian los dos, el SHA
# y el comentario.
#
# El compilador de Rust lo declara `rust-toolchain.toml`, en la raíz: es el mismo aquí y en el
# equipo donde se corta la versión.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Las auditorias cambian aunque el codigo no: un aviso nuevo de RustSec sale sin que nadie haga
  # push. Una vez por semana basta para enterarse antes del siguiente release.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Solo lectura: el workflow corre codigo de PRs de terceros y no necesita tocar nada.
permissions:
  contents: read

# Un push nuevo a la misma rama deja obsoleto el anterior; seguir compilandolo es gastar el runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobaciones:
    name: Pruebas, lint y build
    # Windows y no Ubuntu: la app es solo Windows. `windows`, el SCM y los sockets de `listeners`
    # solo compilan y se prueban de verdad aqui.
    runs-on: windows-latest
    # El semanal solo audita: recompilar Tauri entero para nada es media hora de runner.
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      # Sin acción de terceros: el runner ya trae rustup, y sin argumentos instala la versión y
      # los componentes que pide `rust-toolchain.toml`. Antes iba `dtolnay/rust-toolchain@stable`,
      # que es una rama: ni se podía fijar ni decía qué compilador tocaba cada semana.
      - name: Compilador de Rust (el de rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # `ci` y no `install`: falla si package-lock.json no cuadra con package.json, en vez de
      # arreglarlo en silencio en el runner.
      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Pruebas del frontend
        run: npm test

      # Antes que cargo: `tsc -b` comprueba los tipos, y deja `dist/`, que el contexto de Tauri
      # espera encontrar al compilar.
      - name: Build del frontend
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Después de clippy, que ya ha descargado los crates: el generador lee de cada uno su
      # archivo de licencia. Si falla, `THIRD-PARTY-NOTICES.txt` —que viaja en el instalador— no
      # es el de las dependencias de este commit: se regenera con el mismo guion, sin `--comprobar`.
      - name: Avisos de terceros al día
        run: node tools/avisos-de-terceros.mjs --comprobar

      # Las pruebas de Rust leen procesos reales y lanzan sus propios `node`: en el runner no hay
      # procesos de nadie, que es justo el sitio donde se puede probar sin riesgo.
      # `PDK_EXIGIR_NODE`: varias pruebas lanzan un `node` y, si no pueden, se saltan dándose por
      # superadas. Aquí eso es un fallo (T12-18): lo que se comprueba en la CI se comprueba.
      - name: Pruebas de Rust
        working-directory: src-tauri
        env:
          PDK_EXIGIR_NODE: "1"
        run: cargo test

  auditoria:
    name: Auditoría de dependencias
    # Leer Cargo.lock y package-lock.json no depende del sistema: en Ubuntu tarda la mitad.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      # Mismo umbral que release.ps1: solo produccion y solo avisos altos. Las de desarrollo no
      # viajan en el instalador (ver la fila de `shadcn` en CONTEXT §4).
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit

      # El binario directamente y no `cargo audit`: pasando por `cargo`, rustup instalaría antes
      # el compilador de `rust-toolchain.toml`, y para leer un Cargo.lock no hace falta ninguno.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo-audit audit

      # Lo de arriba mira solo lo que viaja en el instalador, que es lo que bloquea. Las
      # dependencias de desarrollo —ESLint, Vitest, el CLI de shadcn— no viajan, pero corren en el
      # equipo de quien desarrolla y en este runner: sus avisos no pueden quedarse sin que nadie
      # los mire (T12-26). Este paso **no bloquea**: deja el informe en el resumen de la
      # ejecución, también en la del lunes, que es la que se abre para ver si hay algo nuevo.
      - name: Informe del árbol de desarrollo (no bloquea)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Avisos de npm, con las dependencias de desarrollo"
            echo
            echo "No bloquea la CI: lo que viaja en el instalador se audita aparte, y eso sí bloquea."
            echo
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
