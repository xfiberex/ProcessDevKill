[package]
name = "processdevkill"
version = "1.1.1"
description = "Gestor de procesos de desarrollo para Windows"
authors = ["Ricky Angel Jiménez Bueno"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "processdevkill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Solo la feature `system`: no necesitamos discos, red, componentes ni usuarios.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
listeners = "0.6.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "http2"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
sha2 = "0.10"
